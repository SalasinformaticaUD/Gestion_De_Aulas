services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aulas}
      POSTGRES_USER: ${POSTGRES_USER:-aulas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo de entorno}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - reportes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pdf-renderer:
    image: ${COMPOSE_PROJECT_NAME:-aulas}-pdf-renderer:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: python-renderer/Dockerfile
    restart: unless-stopped
    environment:
      REPORT_TEMPLATES_DIR: /app/templates/reportes
      SOFFICE_PATH: /usr/bin/soffice
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-aulas}-migration:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aulas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aulas}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      RUN_DATABASE_SEED: ${RUN_DATABASE_SEED:-false}
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${COMPOSE_PROJECT_NAME:-aulas}-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aulas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aulas}
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo de entorno}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      PERMISSIONS_MODE: ${PERMISSIONS_MODE:-strict}
      MONITORES_API_URL: ${MONITORES_API_URL:-http://host.docker.internal:8000}
      MONITORES_API_TIMEOUT_MS: ${MONITORES_API_TIMEOUT_MS:-5000}
      MONITORES_SERVICE_TOKEN: ${MONITORES_SERVICE_TOKEN:?Defina MONITORES_SERVICE_TOKEN en el archivo de entorno}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Defina CREDENTIALS_ENCRYPTION_KEY en el archivo de entorno}
      PDF_RENDERER_URL: http://pdf-renderer:8001
      PDF_RENDERER_TIMEOUT_MS: ${PDF_RENDERER_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pdf-renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-aulas}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        AULAS_API_URL: http://backend:3000
        MONITORES_API_URL: ${MONITORES_API_URL:-http://host.docker.internal:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  reportes_postgres_data:
