<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Activar cuenta</title></head>
<body>
  <h1>Activar cuenta de monitor</h1>
  {% if validlink %}
    <p>Define una contraseña para completar la activación.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Activar cuenta</button></form>
  {% else %}
    <p>El enlace de activación ya no es válido. Solicita un nuevo correo al administrador.</p>
  {% endif %}
</body></html>
